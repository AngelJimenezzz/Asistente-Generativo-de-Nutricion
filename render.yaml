services:
  - type: web
    name: nutricion-ia-backend
    runtime: python
    rootDir: backend
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: MONGODB_URI
        sync: false
      - key: MONGODB_DB_NAME
        value: nutricion_ia
      - key: APP_ENV
        value: production
      - key: CORS_ORIGINS
        sync: false
      - key: TOGETHER_API_KEY
        sync: false
